name = "Liquibase XML"
grammar = "xml"
path_suffixes = ["changelog.xml", "changelog-master.xml", "liquibase.xml", "changelog-root.xml"]
block_comment = ["<!-- ", " -->"]
brackets = [{ start = "<", end = ">", close = true, newline = true }]
prettier_parser_name = "xml"
prettier_plugins = ["@prettier/plugin-xml"]
